<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aria | Executive Strategic Advisor - Yara Enterprise</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, #0f172a 0%, #020617 100%);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .pulse-wave {
            animation: pulse-ring 2.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.96); opacity: 0.8; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            50% { transform: scale(1.04); opacity: 1; box-shadow: 0 0 30px 10px rgba(99, 102, 241, 0.2); }
            100% { transform: scale(0.96); opacity: 0.8; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
        }
    </style>
</head>

<body class="h-full text-slate-100 flex flex-col antialiased overflow-hidden selection:bg-indigo-500 selection:text-white">

    <header class="w-full glass-panel z-30 border-b border-slate-800/80 px-4 sm:px-8 py-4 shrink-0">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="relative flex items-center justify-center w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 via-indigo-600 to-indigo-500 text-white font-black text-lg shadow-lg shadow-indigo-500/20">
                    A
                    <span class="absolute -top-1 -right-1 flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        Aria
                        <span class="text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                            Yara Enterprise
                        </span>
                    </h1>
                    <p class="text-xs text-slate-400">Executive AI Business & Strategic Consultant</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <span class="text-xs font-medium text-slate-400 hidden sm:inline-block bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-xl">
                    <i class="fa-solid fa-globe text-indigo-400 mr-1.5"></i> Sorani Kurdish & Multilingual
                </span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto flex flex-col justify-center items-center px-4 py-8 gap-8 text-center">

        <div class="w-full glass-panel p-8 sm:p-12 rounded-3xl border border-indigo-500/30 shadow-2xl relative overflow-hidden flex flex-col items-center gap-6">
            <div class="absolute inset-0 bg-gradient-to-b from-indigo-500/10 via-transparent to-transparent pointer-events-none"></div>

            <div class="relative flex items-center justify-center">
                <div class="w-28 h-28 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-indigo-600 via-indigo-500 to-amber-500 p-1 pulse-wave shadow-2xl shadow-indigo-500/30 flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-full flex flex-col items-center justify-center gap-1">
                        <i class="fa-solid fa-microphone-lines text-3xl sm:text-4xl text-amber-400"></i>
                    </div>
                </div>
            </div>

            <div class="space-y-2 max-w-lg">
                <h2 class="text-xl sm:text-2xl font-extrabold text-white">Yara Enterprise Strategic Advisory</h2>
                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
                    Initiate a real-time voice consultation with Aria to discuss business development, corporate strategies, and automation solutions.
                </p>
            </div>

            <button id="vapi-call-btn" onclick="toggleVapiCall()" class="px-8 py-4 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold text-sm sm:text-base rounded-2xl shadow-xl shadow-emerald-600/30 transition-all duration-300 transform active:scale-95 flex items-center gap-3">
                <i class="fa-solid fa-phone text-lg"></i>
                <span id="call-btn-text">Start Voice Consultation</span>
            </button>

            <div id="call-status" class="text-xs text-slate-400 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                <span>Ready to connect</span>
            </div>
        </div>

    </main>

    <script>
        const VAPI_PUBLIC_KEY = "f9fea749-534d-433c-b3c8-7aadc3f7d104";
        const VAPI_ASSISTANT_ID = "f270f469-319e-4529-83f2-e9674b4518cd";
        let isCallActive = false;
        let vapiInstance = null;

        const STRICT_ASSISTANT_OVERRIDE = {
            firstMessage: "Hello, this is Aria from Yara Enterprise. How can I assist with your business strategy today?",
            model: {
                messages: [
                    {
                        role: "system",
                        content: `You are Aria, Senior Business Strategist for Yara Enterprise.

STRICT CONSULTATION & LANGUAGE RULES:
1. FIRST MESSAGE MANDATE: Start EVERY call strictly with English: "Hello, this is Aria from Yara Enterprise. How can I assist with your business strategy today?"
2. KURDISH LANGUAGE LOCK: When the caller speaks Kurdish, reply strictly in native Central Sorani Kurdish script (سۆڕانی پاك بە ئەلفوبێی کوردی).
3. ABSOLUTE ZERO FARSI/PERSIAN: Never use Farsi words. Stick 100% to clean Sorani business vocabulary.
4. LANGUAGE STABILITY: Once a user starts speaking Sorani Kurdish, LOCK into Sorani Kurdish for all remaining turns.
5. NO BULLET POINTS / NO FORMATTING: Keep each reply short and concise (1 to 3 natural sentences max).`
                    }
                ]
            }
        };

        function toggleVapiCall() {
            const callStatus = document.getElementById('call-status');

            if (!isCallActive) {
                callStatus.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                    <span class="text-amber-400">Connecting to Aria...</span>
                `;

                try {
                    if (window.vapiSDK) {
                        vapiInstance = window.vapiSDK.run({
                            apiKey: VAPI_PUBLIC_KEY,
                            assistant: VAPI_ASSISTANT_ID,
                            assistantOverrides: STRICT_ASSISTANT_OVERRIDE
                        });

                        if (vapiInstance) {
                            vapiInstance.on('call-start', () => updateCallUI(true));
                            vapiInstance.on('call-end', () => updateCallUI(false));
                            vapiInstance.on('error', (e) => {
                                console.error("Vapi Error:", e);
                                updateCallUI(false);
                            });
                        } else {
                            updateCallUI(true);
                        }
                    }
                } catch (e) {
                    console.error("Vapi call execution failed:", e);
                    updateCallUI(false);
                }
            } else {
                if (window.vapiSDK && window.vapiSDK.stop) {
                    window.vapiSDK.stop();
                } else if (vapiInstance && vapiInstance.stop) {
                    vapiInstance.stop();
                }
                updateCallUI(false);
            }
        }

        function updateCallUI(active) {
            const btnText = document.getElementById('call-btn-text');
            const callBtn = document.getElementById('vapi-call-btn');
            const callStatus = document.getElementById('call-status');

            isCallActive = active;

            if (active) {
                btnText.innerText = "End Consultation";
                callBtn.className = "px-8 py-4 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold text-sm sm:text-base rounded-2xl shadow-xl shadow-red-600/30 transition-all duration-300 transform active:scale-95 flex items-center gap-3";
                callStatus.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-emerald-400">Call Active — Connected with Aria</span>
                `;
            } else {
                btnText.innerText = "Start Voice Consultation";
                callBtn.className = "px-8 py-4 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold text-sm sm:text-base rounded-2xl shadow-xl shadow-emerald-600/30 transition-all duration-300 transform active:scale-95 flex items-center gap-3";
                callStatus.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span>Ready to connect</span>
                `;
            }
        }
    </script>
</body>
</html>
